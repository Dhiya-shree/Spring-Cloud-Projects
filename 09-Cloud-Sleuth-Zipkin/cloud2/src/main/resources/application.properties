spring.application.name=cloud-service
spring.config.import=optional:configserver:http://localhost:8888
management.endpoints.web.exposure.include=*

#Circuit breaker
management.health.circuitbreakers.enabled=true
resilience4j.circuitbreaker.instances.addressService.register-health-indicator=true
resilience4j.circuitbreaker.instances.addressService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.addressService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.addressService.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.addressService.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.addressService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.addressService.sliding-window-size=5

#Retry
resilience4j.retry.instances.addressService.max-attempts=3
resilience4j.retry.instances.addressService.wait-duration=2s
resilience4j.retry.instances.addressService.register-health-indicator=true


