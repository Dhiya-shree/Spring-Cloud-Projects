spring.application.name=config
server.port=8888

# Limit Actuator endpoints - disable JMX to avoid bean creation issues
management.endpoints.web.exposure.include=health,info,env,metrics
management.endpoints.jmx.exposure.include=

eureka.instance.client.serverUrl.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true

spring.cloud.config.server.git.searchPaths=spring-cloud-config
spring.cloud.config.server.git.uri=https://github.com/Dhiya-shree/config-repo/
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.username=Dhiya-shree
