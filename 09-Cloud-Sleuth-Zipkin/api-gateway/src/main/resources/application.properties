spring.application.name=api-gateway

server.port=9090

eureka.client.register-with-eureka=true
eureka.client.service-url.default-zone=http://localhost:8761/eureka
management.server.web.exposure.include=*

spring.cloud.gateway.server.webmvc.discovery.locator.lower-case-service-id=true

spring.cloud.gateway.server.webmvc.routes[0].id=CLOUD-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CLOUD-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates=Path=/api/info/**

spring.cloud.gateway.server.webmvc.routes[1].id=CLOUD
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://CLOUD
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/address/**


logging.level.*=trace
#
